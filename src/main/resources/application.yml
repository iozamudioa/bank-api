spring:
  application:
    name: bank-api
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/bank_db?replicaSet=rs0&directConnection=true}
  data:
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: DECIMAL128
bank:
  raven:
    base-url: ${BANK_RAVEN_BASE_URL:https://cctv-api.ioza.dev}
    api-key: ${BANK_RAVEN_API_KEY:}
    app-id: ${BANK_RAVEN_APP_ID:bank}
    integration-id: ${BANK_RAVEN_INTEGRATION_ID:bank-webpush}
kingdom:
  tavern:
    lock:
      enabled: true
      issuer: ${KINGDOM_ISSUER}
      royal-archives-uri: ${KINGDOM_ROYAL_ARCHIVES_URI}
    emissary:
      enabled: ${KINGDOM_EMISSARY_ENABLED:true}
      bastion-url: ${KINGDOM_EMISSARY_BASTION_URL:http://bastion:8080}
      username: ${KINGDOM_EMISSARY_USERNAME}
      password: ${KINGDOM_EMISSARY_PASSWORD}
      tavern-name: bank-api
      target: http://bank-api:8080
      domain: bank-api.ioza.dev
      path: /api/v1/**
      health-path: /actuator/health
      capabilities: []
      public-paths: []
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  writer-with-order-by-keys: true
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: false
