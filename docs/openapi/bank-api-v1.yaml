components:
  schemas:
    AccountBalanceResponse:
      type: object
      description: "AccountBalanceResponse: respuesta REST independiente de MongoDB;\
        \ importes numéricos y campos auditados."
      properties:
        free:
          type: number
          format: decimal
          description: "Dinero realmente libre: total menos reserved. Se serializa\
            \ como número JSON decimal, nunca Extended JSON de MongoDB; el frontend\
            \ debe usar aritmética decimal."
          example: 0
          readOnly: true
        id:
          type: string
          description: Identificador opaco; no interpretar ni generar en el frontend.
          example: account-cash
          readOnly: true
        name:
          type: string
          description: Nombre visible.
          example: Efectivo familiar
          readOnly: true
        reserved:
          type: number
          format: decimal
          description: "Parte de total reservada por sobres. Se serializa como nú\
            mero JSON decimal, nunca Extended JSON de MongoDB; el frontend debe usar\
            \ aritmética decimal."
          example: 1080
          readOnly: true
        total:
          type: number
          format: decimal
          description: "Dinero real acumulado; no sumar reserved a este valor. Se\
            \ serializa como número JSON decimal, nunca Extended JSON de MongoDB;\
            \ el frontend debe usar aritmética decimal."
          example: 1080
          readOnly: true
        type:
          type: string
          description: Tipo del recurso según el enum del contrato.
          example: PHYSICAL
          readOnly: true
      readOnly: true
      required:
      - free
      - id
      - name
      - reserved
      - total
      - type
    AccountExpensePreviewResponse:
      type: object
      description: Vista previa sin escrituras; confirmar revalida disponibilidad.
      properties:
        accountId:
          type: string
        amount:
          type: number
          format: decimal
        freeAfter:
          type: number
          format: decimal
        freeBefore:
          type: number
          format: decimal
        totalAfter:
          type: number
          format: decimal
        totalBefore:
          type: number
          format: decimal
    AccountExpenseReplacementRequest:
      type: object
      description: Reemplazo ACCOUNT_EXPENSE; campos completos del nuevo movimiento.
      example:
        type: ACCOUNT_EXPENSE
        amount: 150
        description: Corregido
        accountId: account-cash
      properties:
        accountId:
          type: string
          minLength: 1
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        description:
          type: string
        type:
          type: string
          enum:
          - ACCOUNT_EXPENSE
      required:
      - accountId
      - amount
      - type
    AccountExpenseRequest:
      type: object
      description: Gasto desde saldo libre; no consume reservas.
      example:
        periodId: period-q1
        accountId: account-cash
        amount: 150
        description: Gasto directo
      properties:
        accountId:
          type: string
          minLength: 1
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.01
        description:
          type: string
        periodId:
          type: string
          minLength: 1
      required:
      - accountId
      - amount
      - periodId
    AccountResponse:
      type: object
      description: "AccountResponse: respuesta REST independiente de MongoDB; importes\
        \ numéricos y campos auditados."
      properties:
        active:
          type: boolean
          description: Indica si el recurso o membresía está activo.
          example: true
          readOnly: true
        balance:
          type: number
          format: decimal
          description: "Saldo persistido. En cuenta es dinero real; en sobre es dinero\
            \ reservado dentro de su cuenta. Se serializa como número JSON decimal,\
            \ nunca Extended JSON de MongoDB; el frontend debe usar aritmética decimal."
          example: 80
          readOnly: true
        householdId:
          type: string
          description: Identificador del hogar al que pertenece el recurso.
          example: household-demo
          readOnly: true
        id:
          type: string
          description: Identificador opaco; no interpretar ni generar en el frontend.
          example: account-cash
          readOnly: true
        name:
          type: string
          description: Nombre visible.
          example: Efectivo familiar
          readOnly: true
        type:
          type: string
          description: Tipo del recurso según el enum del contrato.
          enum:
          - PHYSICAL
          - DIGITAL
          example: PHYSICAL
          readOnly: true
        version:
          type: integer
          format: int64
          description: "Versión técnica optimista; sólo lectura, no se envía al registrar\
            \ movimientos."
          example: 0
          readOnly: true
      required:
      - active
      - balance
      - householdId
      - id
      - name
      - type
      - version
    AddMemberRequest:
      type: object
      description: "AddMemberRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        username: cecy
        displayName: Cecy
        role: EDITOR
      properties:
        displayName:
          type: string
          description: Nombre visible del integrante.
          example: Olda
          minLength: 1
        role:
          type: string
          description: "OWNER, EDITOR o VIEWER en respuestas. Al agregar sólo EDITOR/VIEWER;\
            \ omitido usa EDITOR."
          enum:
          - OWNER
          - EDITOR
          - VIEWER
          - EDITOR
          - VIEWER
          example: EDITOR
          nullable: true
        username:
          type: string
          description: Identidad HTTP Basic. Agregar una membresía no registra credenciales.
          example: olda
          minLength: 1
      required:
      - displayName
      - username
    AllocationReplacementRequest:
      type: object
      description: Reemplazo ALLOCATE; campos completos del nuevo movimiento.
      example:
        type: ALLOCATE
        amount: 150
        description: Corregido
        envelopeId: envelope-central
      properties:
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        description:
          type: string
        envelopeId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - ALLOCATE
      required:
      - amount
      - envelopeId
      - type
    AllocationRequest:
      type: object
      description: "AllocationRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        periodId: period-q1
        envelopeId: envelope-central
        amount: 80
        description: Apartado Central
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.01
        description:
          type: string
          description: Concepto opcional del movimiento.
          example: Carne
          nullable: true
        envelopeId:
          type: string
          description: Identificador del sobre del hogar.
          example: envelope-central
          minLength: 1
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          minLength: 1
      required:
      - amount
      - envelopeId
      - periodId
    BalanceEffectResponse:
      type: object
      description: "BalanceEffectResponse: respuesta REST independiente de MongoDB;\
        \ importes numéricos y campos auditados."
      properties:
        after:
          type: number
          format: decimal
          description: "Saldo después de la operación. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 930
          readOnly: true
        before:
          type: number
          format: decimal
          description: "Saldo antes de la operación. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 1080
          readOnly: true
        change:
          type: number
          format: decimal
          description: "Cambio con signo; cero es posible para cuentas bloqueadas\
            \ por una operación de reserva. Se serializa como número JSON decimal,\
            \ nunca Extended JSON de MongoDB; el frontend debe usar aritmética decimal."
          example: -150
          readOnly: true
        entityId:
          type: string
          description: Identificador de la cuenta o sobre afectado.
          example: account-cash
          readOnly: true
      required:
      - after
      - before
      - change
      - entityId
    BudgetLineRequest:
      type: object
      description: "BudgetLineRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        envelopeId: envelope-central
        amount: 4500
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        envelopeId:
          type: string
          description: Identificador del sobre del hogar.
          example: envelope-central
          minLength: 1
      required:
      - amount
      - envelopeId
    BudgetLineResponse:
      type: object
      description: "BudgetLineResponse: respuesta REST independiente de MongoDB; importes\
        \ numéricos y campos auditados."
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          readOnly: true
        envelopeId:
          type: string
          description: Identificador del sobre del hogar.
          example: envelope-central
          readOnly: true
      readOnly: true
      required:
      - amount
      - envelopeId
    BudgetPeriodResponse:
      type: object
      description: "BudgetPeriodResponse: respuesta REST independiente de MongoDB;\
        \ importes numéricos y campos auditados."
      properties:
        endDate:
          type: string
          format: date
          description: Fecha local YYYY-MM-DD; no anterior a startDate ni traslapada
            con otro periodo.
          example: 2026-11-30
          readOnly: true
        expectedIncome:
          type: number
          format: decimal
          description: "Ingreso planificado no negativo; no representa depósito ni\
            \ reserva. Se serializa como número JSON decimal, nunca Extended JSON\
            \ de MongoDB; el frontend debe usar aritmética decimal."
          example: 150
          readOnly: true
        householdId:
          type: string
          description: Identificador del hogar al que pertenece el recurso.
          example: household-demo
          readOnly: true
        id:
          type: string
          description: Identificador opaco; no interpretar ni generar en el frontend.
          example: account-cash
          readOnly: true
        lines:
          type: array
          description: Snapshot de líneas planificadas; no equivale a saldo reservado.
          items:
            $ref: "#/components/schemas/BudgetLineResponse"
          readOnly: true
        startDate:
          type: string
          format: date
          description: "Fecha local YYYY-MM-DD, sin hora ni offset."
