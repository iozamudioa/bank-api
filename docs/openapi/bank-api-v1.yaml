  /api/v1/households/{householdId}/budget-periods/{periodId}/lines/{envelopeId}:
    put:
      description: "OWNER o EDITOR. Inserta o reemplaza una linea exclusivamente en\
        \ una quincena OPEN. Sobre y cuenta activos del hogar. Importe no negativo,\
        \ cero permitido. No modifica plantilla, otros periodos, saldos ni movimientos.\
        \ PUT idempotente; no requiere Idempotency-Key. Ante conflicto concurrente,\
        \ consultar el periodo y reintentar."
      operationId: upsertPeriodBudgetLine
      parameters:
      - description: Identificador del hogar.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      - description: Quincena abierta del hogar.
        example: period-q1
        in: path
        name: periodId
        required: true
        schema:
          type: string
      - description: Sobre activo del hogar.
        example: envelope-central
        in: path
        name: envelopeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPeriodBudgetLineRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPeriodResponse"
          description: Quincena actualizada.
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Importe o sobre/cuenta no disponibles.
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Autenticacion requerida.
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin membresia activa o permiso de escritura.
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Periodo, sobre o cuenta no encontrados para el hogar."
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Quincena no abierta o escritura concurrente.
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno.
        "503":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible.
      summary: Guardar lo planeado para un sobre
      tags:
      - Budget Periods
  /api/v1/households/{householdId}/budget-template:
    get:
      description: Requiere membresía activa. 404 si todavía no hay plantilla.
      operationId: getBudgetTemplate
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                id: template-demo
                householdId: household-demo
                expectedIncome: 21000
                lines:
                - envelopeId: envelope-central
                  amount: 4500
                - envelopeId: envelope-sams
                  amount: 1000
              schema:
                $ref: "#/components/schemas/BudgetTemplateResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "403":
          content:
            application/json:
              example:
                error: FORBIDDEN
                message: No perteneces a este hogar
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin membresía activa o permisos de escritura/OWNER.
        "404":
          content:
            application/json:
              example:
                error: NOT_FOUND
                message: Hogar no encontrado
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Hogar o recurso no encontrado para este hogar.
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Consultar presupuesto habitual
      tags:
      - Budgets
    put:
      description: "OWNER o EDITOR. Importes no negativos, sobres únicos y activos\
        \ del hogar. Cambia planificación, nunca saldos; no cambia snapshots ya creados."
      operationId: saveBudgetTemplate
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBudgetRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: template-demo
                householdId: household-demo
                expectedIncome: 21000
                lines:
                - envelopeId: envelope-central
                  amount: 4500
                - envelopeId: envelope-sams
                  amount: 1000
              schema:
                $ref: "#/components/schemas/BudgetTemplateResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "400":
          content:
            application/json:
              example:
                error: BAD_REQUEST
                message: Solicitud inválida o incompleta
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Request, importe o filtros inválidos; saldo insuficiente tambié\
            n devuelve 400."
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "403":
          content:
            application/json:
              example:
                error: FORBIDDEN
                message: No perteneces a este hogar
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin membresía activa o permisos de escritura/OWNER.
        "404":
          content:
            application/json:
              example:
                error: NOT_FOUND
                message: Hogar no encontrado
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Hogar o recurso no encontrado para este hogar.
        "409":
          content:
            application/json:
              example:
                error: CONFLICT
                message: Conflicto de operación; reintenta con la misma Idempotency-Key.
                  Si cambiaste el contenido usa otra clave.
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Conflicto de negocio, clave reutilizada con datos distintos,\
            \ versión o transacción concurrente."
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Guardar presupuesto habitual
      tags:
      - Budgets
  /api/v1/households/{householdId}/budget-template/lines/{envelopeId}:
