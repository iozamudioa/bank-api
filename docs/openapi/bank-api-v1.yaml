        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible; en confirmaciones reintentar con
            misma clave y datos.
      summary: Corregir movimiento de forma atomica
      tags:
      - Movements
  /api/v1/households/{householdId}/movements/{id}/corrections/preview:
