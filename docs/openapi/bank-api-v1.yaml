                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Listar quincenas
      tags:
      - Budget Periods
    post:
      description: "OWNER o EDITOR. Copia snapshot de la plantilla; exige fechas ordenadas\
        \ y sin traslape. open=true crea OPEN, omitido crea DRAFT. No hay endpoint\
        \ para abrir un DRAFT. No deposita ni reserva dinero."
      operationId: createBudgetPeriod
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePeriodRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: period-q1
                householdId: household-demo
                startDate: 2026-11-15
                endDate: 2026-11-30
                status: OPEN
                expectedIncome: 21000
                lines:
                - envelopeId: envelope-central
                  amount: 4500
                - envelopeId: envelope-sams
                  amount: 1000
              schema:
                $ref: "#/components/schemas/BudgetPeriodResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "400":
          content:
            application/json:
              example:
