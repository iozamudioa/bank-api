      tags:
      - Movements
  /api/v1/households/{householdId}/movements/{id}/reverse:
    post:
      description: OWNER o EDITOR y quincena OPEN de destino. Aplica efectos inversos
        contra saldos actuales y marca original REVERSED atómicamente. No admite reversión
        de una REVERSAL ni segunda reversión. Idempotency-Key obligatoria; no hay
        ajuste arbitrario de saldo.
      operationId: reverseMovement
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      - description: Identificador del movimiento del hogar.
        example: movement-expense
        in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: movement-reverse
                householdId: household-demo
                periodId: period-q1
                type: REVERSAL
                status: POSTED
                amount: 150
                description: Carne
                targetEnvelopeId: envelope-central
                incomeSourceId: null
                actor: olda
                occurredAt: 2026-11-15T18:00:00Z
                reversalOf: movement-expense
                funding: []
                accountEffects:
                - entityId: account-cash
                  before: 930
                  change: 150
                  after: 1080
                envelopeEffects:
                - entityId: envelope-central
                  before: 0
                  change: 80
                  after: 80
                - entityId: envelope-sams
                  before: 930
                  change: 70
                  after: 1000
              schema:
                $ref: "#/components/schemas/MovementResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "400":
          content:
            application/json:
              example:
                error: BAD_REQUEST
                message: Solicitud inválida o incompleta
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Request, importe o filtros inválidos; saldo insuficiente tambié\
            n devuelve 400."
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "403":
          content:
            application/json:
              example:
                error: FORBIDDEN
                message: No perteneces a este hogar
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin membresía activa o permisos de escritura/OWNER.
        "404":
          content:
            application/json:
              example:
                error: NOT_FOUND
                message: Hogar no encontrado
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Hogar o recurso no encontrado para este hogar.
        "409":
          content:
            application/json:
              example:
                error: CONFLICT
                message: Conflicto de operación; reintenta con la misma Idempotency-Key.
                  Si cambiaste el contenido usa otra clave.
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Conflicto de negocio, clave reutilizada con datos distintos,\
            \ versión o transacción concurrente."
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Revertir un movimiento
      tags:
      - Movements
  /api/v1/me:
