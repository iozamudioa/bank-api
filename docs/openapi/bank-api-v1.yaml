openapi: 3.0.1
info:
  description: "API para administración financiera familiar mediante cuentas, sobres,\
    \ presupuestos y movimientos."
  title: BANK API
  version: 1.0.0
servers:
- description: Mismo origen; recursos bajo /api/v1
  url: /
security:
- basicAuth: []
paths:
  /api/v1/households:
    get:
      description: Sólo devuelve hogares con membresía activa del usuario.
      operationId: listHouseholds
      responses:
        "200":
          content:
            application/json:
              example:
              - id: household-demo
                name: Familia
                currency: MXN
                timezone: America/Mexico_City
                active: true
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Listar mis hogares
      tags:
      - Households
    post:
      description: Crea el hogar MXN y su membresía OWNER de forma transaccional.
      operationId: createHousehold
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: household-demo
                name: Familia
                currency: MXN
                timezone: America/Mexico_City
                active: true
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "400":
          content:
            application/json:
              example:
                error: BAD_REQUEST
                message: Solicitud inválida o incompleta
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Request, importe o filtros inválidos; saldo insuficiente tambié\
            n devuelve 400."
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "409":
          content:
            application/json:
              example:
                error: CONFLICT
                message: Conflicto de operación; reintenta con la misma Idempotency-Key.
                  Si cambiaste el contenido usa otra clave.
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Conflicto de negocio, clave reutilizada con datos distintos,\
            \ versión o transacción concurrente."
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Crear hogar
      tags:
      - Households
  /api/v1/households/{householdId}:
    get:
      description: Requiere membresía activa.
      operationId: getHousehold
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                id: household-demo
                name: Familia
                currency: MXN
                timezone: America/Mexico_City
                active: true
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
