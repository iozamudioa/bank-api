                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Transferir dinero libre entre cuentas
      tags:
      - Movements
  /api/v1/households/{householdId}/movements/{id}:
    get:
      description: Requiere membresía activa. Incluye efectos antes/cambio/después
        y fuentes de gasto.
      operationId: getMovement
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      - description: Identificador del movimiento del hogar.
        example: movement-expense
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                id: movement-expense
                householdId: household-demo
                periodId: period-q1
                type: EXPENSE
                status: POSTED
                amount: 150
                description: Carne
                targetEnvelopeId: envelope-central
                incomeSourceId: null
                actor: olda
                occurredAt: 2026-11-15T18:00:00Z
                reversalOf: null
                funding:
                - envelopeId: envelope-central
                  amount: 80
                - envelopeId: envelope-sams
                  amount: 70
                accountEffects:
                - entityId: account-cash
                  before: 1080
                  change: -150
                  after: 930
                envelopeEffects:
                - entityId: envelope-central
                  before: 80
                  change: -80
                  after: 0
                - entityId: envelope-sams
                  before: 1000
                  change: -70
                  after: 930
              schema:
                $ref: "#/components/schemas/MovementResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "401":
          content:
            application/json:
              example:
                error: UNAUTHORIZED
                message: Autenticación HTTP Basic requerida o credenciales inválidas
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Credenciales HTTP Basic ausentes o inválidas.
        "403":
          content:
            application/json:
              example:
                error: FORBIDDEN
                message: No perteneces a este hogar
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin membresía activa o permisos de escritura/OWNER.
        "404":
          content:
            application/json:
              example:
                error: NOT_FOUND
                message: Hogar no encontrado
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Hogar o recurso no encontrado para este hogar.
        "500":
          content:
            application/json:
              example:
                error: INTERNAL_SERVER_ERROR
                message: Error interno; si ocurrió durante una operación financiera
                  reintenta con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error interno inesperado; no crear otra clave para repetir
            una operación financiera incierta.
        "503":
          content:
            application/json:
              example:
                error: SERVICE_UNAVAILABLE
                message: Persistencia no disponible o confirmación incierta; reintenta
                  con la misma Idempotency-Key
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Persistencia no disponible o confirmación incierta; en movimientos
            repetir misma clave y datos.
      summary: Consultar movimiento
      tags:
      - Movements
  /api/v1/households/{householdId}/movements/{id}/corrections:
    post:
      description: "OWNER o EDITOR. Registra compensacion y reemplazo en periodo OPEN,\
        \ conserva tipo y original REVERSED. No admite OPENING_BALANCE, REVERSAL ni\
        \ originales revertidos. Valida solo saldos netos finales. Idempotency-Key\
        \ obligatoria. correction vincula original y compensacion; efectos del reemplazo\
        \ son virtuales para auditoria, no saldos intermedios persistidos."
      operationId: correctMovement
      parameters:
      - description: Hogar con membresia activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      - description: Movimiento original del hogar.
        example: movement-original
        in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"
          description: Operacion exitosa.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Solicitud o saldo neto invalido.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Autenticacion requerida.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sin permiso de escritura.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Recurso activo del hogar no encontrado.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Periodo cerrado, original no corregible, clave reutilizada\
            \ o conflicto concurrente."
        "500":
          content:
