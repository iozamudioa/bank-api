          description: Identificador del hogar al que pertenece el recurso.
          example: household-demo
          readOnly: true
        id:
          type: string
          description: Identificador opaco; no interpretar ni generar en el frontend.
          example: account-cash
          readOnly: true
        name:
          type: string
          description: Nombre visible.
          example: Efectivo familiar
          readOnly: true
        type:
          type: string
          description: Tipo del recurso según el enum del contrato.
          enum:
          - PAYROLL
          - TRANSFER
          - TANDA
          - OTHER
          example: PAYROLL
          readOnly: true
      required:
      - active
      - defaultAccountId
      - expectedAmount
      - householdId
      - id
      - name
      - type
    MovementReplacementRequest:
      type: object
      description: Reemplazo completo. EXPENSE usa sobres; ACCOUNT_EXPENSE usa saldo
        libre. Ambos conservan MovementType.EXPENSE.
      discriminator:
        mapping:
          ACCOUNT_EXPENSE: "#/components/schemas/AccountExpenseReplacementRequest"
          ALLOCATE: "#/components/schemas/AllocationReplacementRequest"
          ENVELOPE_TRANSFER: "#/components/schemas/EnvelopeTransferReplacementRequest"
          EXPENSE: "#/components/schemas/ExpenseReplacementRequest"
          INCOME: "#/components/schemas/IncomeReplacementRequest"
          REALLOCATE: "#/components/schemas/ReallocationReplacementRequest"
          RELEASE: "#/components/schemas/ReleaseReplacementRequest"
          TRANSFER: "#/components/schemas/TransferReplacementRequest"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/IncomeReplacementRequest"
      - $ref: "#/components/schemas/AllocationReplacementRequest"
      - $ref: "#/components/schemas/ReleaseReplacementRequest"
      - $ref: "#/components/schemas/ReallocationReplacementRequest"
      - $ref: "#/components/schemas/TransferReplacementRequest"
      - $ref: "#/components/schemas/EnvelopeTransferReplacementRequest"
      - $ref: "#/components/schemas/ExpenseReplacementRequest"
      - $ref: "#/components/schemas/AccountExpenseReplacementRequest"
      properties:
        type:
          type: string
      required:
      - type
    MovementReplacementResponse:
      type: object
      description: Comando de reemplazo confirmado con recursos explicitos historicos.
        Permite editar otra vez incluso con importe cero; no se deduce de efectos
        o saldos actuales.
      nullable: true
      properties:
        accountId:
          type: string
          nullable: true
        amount:
          type: number
          format: decimal
          minimum: 0
        description:
          type: string
          nullable: true
        envelopeId:
          type: string
          nullable: true
        fromAccountId:
          type: string
          nullable: true
        fromEnvelopeId:
          type: string
          nullable: true
        fundingSources:
          type: array
          items:
            $ref: "#/components/schemas/FundingResponse"
        incomeSourceId:
          type: string
          nullable: true
        targetEnvelopeId:
          type: string
          nullable: true
        toAccountId:
          type: string
          nullable: true
        toEnvelopeId:
          type: string
          nullable: true
        type:
          type: string
          enum:
          - INCOME
          - ALLOCATE
          - RELEASE
          - REALLOCATE
          - TRANSFER
          - ENVELOPE_TRANSFER
          - EXPENSE
          - ACCOUNT_EXPENSE
      readOnly: true
      required:
      - amount
      - type
    MovementResponse:
      type: object
      description: "MovementResponse: respuesta REST independiente de MongoDB; importes\
        \ numéricos y campos auditados."
      properties:
        accountEffects:
          type: array
          description: "Cambios auditados de cuentas reales, incluso efectos cero\
            \ usados para proteger reservas."
          items:
            $ref: "#/components/schemas/BalanceEffectResponse"
          readOnly: true
        actor:
          type: string
          description: Username autenticado que registró la operación.
          example: olda
          readOnly: true
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          readOnly: true
        correction:
          $ref: "#/components/schemas/CorrectionLinkResponse"
        description:
          type: string
          description: Concepto opcional del movimiento.
          example: Carne
          nullable: true
          readOnly: true
        envelopeEffects:
          type: array
          description: Cambios auditados de reservas.
          items:
            $ref: "#/components/schemas/BalanceEffectResponse"
          readOnly: true
        funding:
          type: array
          description: Aportaciones auditadas del gasto; no son movimientos adicionales.
          items:
            $ref: "#/components/schemas/FundingResponse"
          readOnly: true
        householdId:
          type: string
          description: Identificador del hogar al que pertenece el recurso.
          example: household-demo
          readOnly: true
        id:
          type: string
          description: Identificador opaco; no interpretar ni generar en el frontend.
          example: account-cash
          readOnly: true
        incomeSourceId:
          type: string
          description: "Fuente activa del hogar, opcional. No determina automáticamente\
            \ la cuenta del ingreso."
          example: income-payroll
          nullable: true
          readOnly: true
        occurredAt:
          type: string
          format: date-time
          description: "Instante UTC ISO-8601, precisión de milisegundos. No es la\
            \ fecha local de la quincena."
          example: 2026-11-15T18:00:00Z
          readOnly: true
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          nullable: true
          readOnly: true
        replacement:
          $ref: "#/components/schemas/MovementReplacementResponse"
        reversalOf:
          type: string
          description: Identificador del original si type=REVERSAL; null en otros
            movimientos.
          example: movement-original
          nullable: true
          readOnly: true
        status:
          type: string
          description: Estado persistido del recurso.
          enum:
          - POSTED
          - REVERSED
          example: POSTED
          readOnly: true
        targetEnvelopeId:
          type: string
          description: Sobre principal al que se atribuye el gasto. La cuenta de pago
            se deriva de este sobre.
          example: envelope-central
          nullable: true
          readOnly: true
        type:
          type: string
          description: Tipo del recurso según el enum del contrato.
          enum:
          - OPENING_BALANCE
          - INCOME
          - ALLOCATE
          - RELEASE
          - REALLOCATE
          - EXPENSE
          - TRANSFER
          - ENVELOPE_TRANSFER
          - REVERSAL
          example: EXPENSE
          readOnly: true
      required:
      - accountEffects
      - actor
      - amount
      - description
      - envelopeEffects
      - funding
      - householdId
      - id
      - incomeSourceId
      - occurredAt
      - periodId
      - reversalOf
      - status
      - targetEnvelopeId
      - type
    OpeningBalanceRequest:
      type: object
      description: "OpeningBalanceRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        accountId: account-cash
        amount: 1080
        description: Saldo inicial real
      properties:
        accountId:
          type: string
          description: Cuenta activa del mismo hogar. Determina dónde está el dinero
            real.
          example: account-cash
          minLength: 1
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.01
        description:
          type: string
          description: Concepto opcional del movimiento.
          example: Carne
          nullable: true
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          nullable: true
      required:
      - accountId
      - amount
    ReallocationReplacementRequest:
      type: object
      description: Reemplazo REALLOCATE; campos completos del nuevo movimiento.
      example:
        type: REALLOCATE
        amount: 150
        description: Corregido
        fromEnvelopeId: envelope-central
        toEnvelopeId: envelope-central
      properties:
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        description:
          type: string
        fromEnvelopeId:
          type: string
          minLength: 1
        toEnvelopeId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - REALLOCATE
      required:
      - amount
      - fromEnvelopeId
      - toEnvelopeId
      - type
    ReallocationRequest:
      type: object
      description: "ReallocationRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        periodId: period-q1
        fromEnvelopeId: envelope-sams
        toEnvelopeId: envelope-central
        amount: 70
        description: Apoyo de presupuesto
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.01
        description:
          type: string
          description: Concepto opcional del movimiento.
          example: Carne
          nullable: true
        fromEnvelopeId:
          type: string
          description: Identificador fromEnvelopeId del mismo hogar; origen y destino
            deben ser distintos.
          example: envelope-sams
          minLength: 1
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          minLength: 1
        toEnvelopeId:
          type: string
          description: Identificador toEnvelopeId del mismo hogar; origen y destino
            deben ser distintos.
          example: envelope-central
          minLength: 1
      required:
      - amount
      - fromEnvelopeId
      - periodId
      - toEnvelopeId
    ReleaseReplacementRequest:
      type: object
      description: Reemplazo RELEASE; campos completos del nuevo movimiento.
      example:
        type: RELEASE
        amount: 150
        description: Corregido
        envelopeId: envelope-central
      properties:
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        description:
          type: string
        envelopeId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - RELEASE
      required:
      - amount
      - envelopeId
      - type
    ReverseRequest:
      type: object
      description: "ReverseRequest: entrada REST; validaciones Jakarta y reglas adicionales\
        \ en la operación."
      example:
        periodId: period-q1
        reason: Captura equivocada
      properties:
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          minLength: 1
        reason:
          type: string
          description: Motivo obligatorio de la reversión.
          example: Captura equivocada
          minLength: 1
      required:
      - periodId
      - reason
    SaveBudgetRequest:
      type: object
      description: "SaveBudgetRequest: entrada REST; validaciones Jakarta y reglas\
        \ adicionales en la operación."
      example:
        expectedIncome: 21000
        allocations:
        - envelopeId: envelope-central
          amount: 4500
        - envelopeId: envelope-sams
          amount: 1000
      properties:
        allocations:
          type: array
          description: "Líneas del plan: sobres activos del hogar, sin duplicados,\
            \ importes no negativos. Puede ser lista vacía."
          items:
            $ref: "#/components/schemas/BudgetLineRequest"
        expectedIncome:
          type: number
          format: decimal
          description: "Ingreso planificado no negativo; no representa depósito ni\
            \ reserva. Se serializa como número JSON decimal, nunca Extended JSON\
            \ de MongoDB; el frontend debe usar aritmética decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
      required:
      - allocations
      - expectedIncome
    TransferReplacementRequest:
      type: object
      description: Reemplazo TRANSFER; campos completos del nuevo movimiento.
      example:
        type: TRANSFER
        amount: 150
        description: Corregido
        fromAccountId: account-cash
        toAccountId: account-cash
      properties:
        amount:
          type: number
          format: decimal
          example: 150
          exclusiveMinimum: false
          minimum: 0.00
        description:
          type: string
        fromAccountId:
          type: string
          minLength: 1
        toAccountId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - TRANSFER
      required:
      - amount
      - fromAccountId
      - toAccountId
      - type
    TransferRequest:
      type: object
      description: "TransferRequest: entrada REST; validaciones Jakarta y reglas adicionales\
        \ en la operación."
      example:
        periodId: period-q1
        fromAccountId: account-digital
        toAccountId: account-cash
        amount: 1080
        description: Retiro para sobres
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe decimal MXN. Número JSON, máximo dos decimales y 32\
            \ dígitos enteros; sin redondeo implícito. Se serializa como número JSON\
            \ decimal, nunca Extended JSON de MongoDB; el frontend debe usar aritmé\
            tica decimal."
          example: 150
          exclusiveMinimum: false
          minimum: 0.01
        description:
          type: string
          description: Concepto opcional del movimiento.
          example: Carne
          nullable: true
        fromAccountId:
          type: string
          description: Identificador fromAccountId del mismo hogar; origen y destino
            deben ser distintos.
          example: account-digital
          minLength: 1
        periodId:
          type: string
          description: Quincena del movimiento; debe estar OPEN al confirmar. En saldo
            inicial puede omitirse y se ignora.
          example: period-q1
          minLength: 1
        toAccountId:
          type: string
          description: Identificador toAccountId del mismo hogar; origen y destino
            deben ser distintos.
          example: account-cash
          minLength: 1
      required:
      - amount
      - fromAccountId
      - periodId
      - toAccountId
    UpsertPeriodBudgetLineRequest:
      type: object
      description: Importe planeado para un sobre en una quincena abierta.
      example:
        amount: 1500
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe MXN no negativo; maximo dos decimales, sin redondeo."
          example: 1500
          exclusiveMinimum: false
          minimum: 0.00
      required:
      - amount
    UpsertTemplateBudgetLineRequest:
      type: object
      description: Plan habitual de un solo sobre; no requiere quincena.
      example:
        amount: 4800
      properties:
        amount:
          type: number
          format: decimal
          description: "Importe no negativo, maximo dos decimales sin redondeo. Cero\
            \ es valido."
          example: 4800
          exclusiveMinimum: false
          minimum: 0.00
      required:
      - amount
    UserResponse:
      type: object
      description: "UserResponse: respuesta REST independiente de MongoDB; importes\
        \ numéricos y campos auditados."
      properties:
        username:
          type: string
          description: Identidad HTTP Basic. Agregar una membresía no registra credenciales.
          example: olda
          readOnly: true
      required:
      - username
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
