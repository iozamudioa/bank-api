      operationId: createAccount
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: account-cash
                householdId: household-demo
                name: Efectivo familiar
                type: PHYSICAL
                balance: 0
                version: 0
                active: true
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
        "400":
          content:
            application/json:
              example:
                error: BAD_REQUEST
                message: Solicitud inválida o incompleta
              schema:
