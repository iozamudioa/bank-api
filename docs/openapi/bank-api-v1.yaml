  /api/v1/households/{householdId}/budget-periods:
    get:
      description: "Requiere membresía activa. Ordenadas por fecha de inicio descendente,\
        \ de la más reciente a la más antigua. Los remanentes están en los sobres,\
        \ no se reinician al cambiar de periodo."
      operationId: listBudgetPeriods
      parameters:
      - description: Identificador del hogar; se verifica membresía activa.
        example: household-demo
        in: path
        name: householdId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
              - id: period-q1
                householdId: household-demo
                startDate: 2026-11-15
                endDate: 2026-11-30
                status: OPEN
                expectedIncome: 21000
                lines:
                - envelopeId: envelope-central
                  amount: 4500
                - envelopeId: envelope-sams
                  amount: 1000
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetPeriodResponse"
          description: Operación exitosa. Se conserva HTTP 200 en creaciones y replay.
